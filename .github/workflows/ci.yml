name: SDK checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15-intel]
        python: ['3.8', '3.10', '3.12']
        include:
          - os: macos-15
            python: '3.10'
          - os: macos-15
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python tools/check_examples.py
      - run: python -m build
      - run: python tools/check_distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.os }}-${{ matrix.python }}
          path: dist/
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,docs]"
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python tools/build_docs.py
      - run: python tools/check_docs.py
      - uses: actions/upload-artifact@v4
        with:
          name: bilingual-documentation
          path: docs/_build/html/
